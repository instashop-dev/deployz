name: AWS persistent canary

# Read-only verification of the standing tagged canary installation
# (docs/testing/aws-canary.md). Checks that the relay's real AWS SDK calls
# still work against a real, persistent customer install — CloudFormation,
# ECS, and ELB health probes, all read-only. Deliberately NOT part of the PR
# check set: it requires a standing AWS installation, takes minutes, and
# costs money. Run it on demand after changes to the relay, verify/
# observe-health logic, or the ECS/ELB adapter types.
on:
  workflow_dispatch:

# One read-only canary at a time: share nothing but the standing install.
concurrency:
  group: aws-persistent-canary
  cancel-in-progress: false

jobs:
  persistent-canary:
    name: Persistent canary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # An IAM identity with read-only access to the TEST account only.
      # The harness refuses any other account (DEPLOYZ_CANARY_EXPECTED_ACCOUNT).
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_CANARY_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_CANARY_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      DEPLOYZ_E2E_ALLOW_REAL_AWS: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm build

      - name: Refuse to run without the canary credentials
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "AWS_CANARY_ACCESS_KEY_ID / AWS_CANARY_SECRET_ACCESS_KEY are not configured" >&2
            exit 1
          fi

      # Runs verifyInstallation, observeRuntimeHealth, and
      # listAllStackResources against the standing canary install.
      # Prints the verify-ladder result (CloudFormation stack health,
      # ECS service status, ELB target health) as part of vitest output.
      - name: Run the persistent canary
        run: pnpm e2e:canary

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: persistent-canary-results-${{ github.run_id }}
          path: canary-results/
          retention-days: 30