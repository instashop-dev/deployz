name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# One CI run per change: a feature-branch push without a PR starts no CI,
# and a newer commit on a PR cancels the superseded run. Pushes to main
# get their own group and are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # Local Turborepo cache: lets `pnpm build` / `pnpm lint` reuse task
      # outputs restored from an earlier SHA. Turbo verifies task hashes,
      # so a partial restore stays safe. Tests run through vitest directly
      # and are never satisfied from this cache.
      - name: Cache Turborepo output
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm build

      - name: Run tests
        run: pnpm vitest run

      - name: Lint
        run: pnpm lint

      # scripts/ is not a workspace package, so `pnpm build` never
      # compiles the four real-AWS harnesses and eslint only covers the
      # .mjs runners. Without this they reach a live AWS run unchecked.
      - name: Typecheck the AWS harnesses
        run: pnpm typecheck:scripts

  # Simulated E2E (docs/testing/e2e-testing.md): the mode/guard tests plus the
  # full simulated scenario regression suite. Runs through scripts/e2e.mjs, so
  # the job-level AWS values below double as a live proof that simulated mode
  # scrubs them from the API under test. They are fake sentinels: PR CI never
  # receives real AWS credentials (only the manual canary and deploy
  # workflows hold real ones). The visual suite stays out of PR CI
  # (Windows-generated snapshots — see e2e.yml).
  e2e-simulated:
    name: Simulated E2E
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: simulated-test-access-key
      AWS_SECRET_ACCESS_KEY: simulated-test-secret
      AWS_REGION: us-east-1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Cache Turborepo output
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E mode guards
        run: node scripts/e2e.mjs e2e/e2e-modes.spec.ts

      - name: Simulated scenario suite
        run: node scripts/e2e.mjs --scenarios

      # Phase 14 — the default-HTTPS simulated-provider suite (scenarios A–H)
      # needs the fixture default-HTTPS machine ON, which the ordinary
      # simulated run deliberately keeps off (HTTP-only installs). Boot the
      # same file against a dedicated server instance with the opt-in flag.
      - name: Default-HTTPS simulated scenarios
        run: DEPLOYZ_DEFAULT_HTTPS_FIXTURE=true node scripts/e2e.mjs e2e/scenario-default-https.spec.ts

      - name: Team Admin flows
        run: node scripts/e2e.mjs e2e/admin.spec.ts

      # Per-state coverage of the vendor deployment detail page, rendered from
      # mocked API responses — the states a live relay cannot cheaply be driven
      # to (a failed update over a live release, a removed deployment with
      # retained resources, a relay that went quiet, degraded fetches).
      - name: Deployment detail states
        run: node scripts/e2e.mjs e2e/deployment-detail.spec.ts

      - name: Upload traces on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-simulated-results
          path: test-results/
          retention-days: 7
