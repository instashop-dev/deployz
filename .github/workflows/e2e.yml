name: e2e

# On-demand end-to-end run (Playwright boots the real API + web with fixture
# modes). Not part of the PR check set: the committed visual snapshots are
# Windows-generated; regenerate per-platform with
# `pnpm exec playwright test e2e/visual.spec.ts --update-snapshots`.
on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test --grep-invert visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
