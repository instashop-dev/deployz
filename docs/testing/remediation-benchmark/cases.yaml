# Remediation (fix-instructions) benchmark. Loader and schema:
# scripts/remediation-benchmark/cases.ts. Method: README.md.
#
# `repositories` are the pinned analysis snapshots in snapshots/ (written by
# scripts/remediation-benchmark/capture.ts from the compatibility benchmark's
# pinned commits). `cases` are a snapshot as analysed, or with a targeted
# synthetic mutation, plus the expected class of every unresolved finding
# and the content the document must or must not carry.
#
# `classes` are blind labels from independent labellers who saw only the
# taxonomy and the evidence (never the generator). Adjudicated labels, where
# the labellers disagreed with each other or with the merge design:
#   RB-30 database-migrations NEEDS_INPUT (merged into the migration question)
#   RB-30 worker-command NEEDS_INPUT (same finding labelled NEEDS_INPUT in RB-02)
# `truth` are the labellers' classes after reading the repository at the
# pinned commit; they measure the analysis, not the generator.
version: 1

repositories:
  - { id: repo-003, role: primary }   # kutt: Node/Express, PostgreSQL, migrations at startup
  - { id: repo-033, role: primary }   # paperless-ngx: Django, Celery, s6 supervisor image, local data
  - { id: repo-300, role: primary }   # deployz-phase5-canary: correctly configured, worker + SQS
  - { id: repo-034, role: holdout }   # CTFd: Flask, MySQL — never used to tune the generator
  - { id: repo-001, role: support }
  - { id: repo-009, role: support }
  - { id: repo-013, role: support }
  - { id: repo-015, role: support }
  - { id: repo-016, role: support }
