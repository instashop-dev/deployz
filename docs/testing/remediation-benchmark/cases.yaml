    expect:
      classes: { health-check: ALREADY_SUPPORTED, database-migrations: ALREADY_SUPPORTED, worker-command: NEEDS_INPUT }
      truth: { health-check: ALREADY_SUPPORTED, database-migrations: ALREADY_SUPPORTED, worker-command: ALREADY_SUPPORTED }
      include: ["`/api/health` as the health check path"]
  - id: RB-28
    snapshot: repo-003
    title: kutt on MySQL with no migration command found
    tags: [mutation, database, migrations]
    mutation:
      removeFindings: [database-migrations]
      addFindings:
        - { id: database-migrations, severity: recommended, confidence: likely, evidence: A MySQL library is present but no migration command was found in the image start path or any package.json., outcome: Add a script that applies database migrations non-interactively (for example a "db:migrate" entry in package.json). }
      metadata: { usesPostgresql: false, usesMysql: true, migrationMode: unknown }
    expect:
      classes: { health-check: APPLICATION_FIX, worker-command: NEEDS_INPUT, database-migrations: CONFIGURATION_FIX }
      truth: { health-check: CONFIGURATION_FIX, worker-command: ALREADY_SUPPORTED, database-migrations: CONFIGURATION_FIX }
  - id: RB-29
    snapshot: repo-003
    title: kutt with a declared Procfile worker (valid worker setup)
