      metadata: { resolvedWorkerCommands: [{ id: worker, command: node server/worker.js, source: Procfile }] }
    expect:
      classes: { health-check: APPLICATION_FIX, database-migrations: ALREADY_SUPPORTED, worker-process: ALREADY_SUPPORTED }
      truth: { health-check: CONFIGURATION_FIX, database-migrations: ALREADY_SUPPORTED, worker-process: ALREADY_SUPPORTED }
      include: ["- Declared workers: `node server/worker.js`", "Keep every declared worker as its own process"]
