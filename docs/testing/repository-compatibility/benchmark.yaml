    notes:
      - "docker/docker-compose.yml: immich-server (Node) and immich-machine-learning (Python) are two application containers plus redis (valkey) and a custom pgvector PostgreSQL image -> docker-compose-multi-service."
      - "server/Dockerfile: VOLUME /data, EXPOSE 2283, HEALTHCHECK immich-healthcheck (curls /api/server/ping); uploads are written to the container disk under /data with no object-storage option -> local-filesystem."
      - "Worker code (bullmq queues) runs inside the immich-server process by default (IMMICH_WORKERS_INCLUDE/EXCLUDE splits it only on request) -> worker: true, no separate process required. Migrations under server/src/schema/migrations apply at startup."
      - "PostgreSQL requires the pgvector/VectorChord extensions (ghcr.io/immich-app/postgres image), which a plain managed PostgreSQL does not provide; recorded as postgres: true per the definition (PostgreSQL is the engine) with this caveat."
