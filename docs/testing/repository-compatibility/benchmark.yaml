# Stage A repository-compatibility benchmark. Schema and cross-checks:
# scripts/repository-compatibility/manifest.ts. Method: README.md.
#
# `findings` is the machine index of findings.md (id, type, and the facts the
# finding explains). `repositories` pins every audited snapshot to an
# immutable commit and states the minimal expected facts.
version: 1

findings: []

repositories:
  - id: repo-001
    repository: umami-software/umami
    commit: ca661c7057984aa98ed4f7083d84dae2f65bfcb0
    cohort: realistic
    set: improvement
    expected:
      compatibility: NEEDS_CONFIGURATION
      runtime: [node]
      monorepo: false
      postgres: true
      redis: false
      worker: false
      storage: false
      migration: true
      dockerfilePath: Dockerfile
      port: 3000
      healthPath: /api/heartbeat
      unsupported: []
    customer_realism: high
    difficulty: 3
    notes:
      - "Next.js 16 + Prisma (provider postgresql). Root Dockerfile: EXPOSE 3000, ENV PORT=3000, CMD sh scripts/start-docker.sh."
      - "Health: file route src/app/api/heartbeat/route.ts -> /api/heartbeat (also the compose healthcheck)."
      - "Migrations: package.json update-db = prisma migrate deploy (key has no 'migrat')."
      - "APP_SECRET is read without a default (src/lib/crypto.ts) and has no committed sample value -> NEEDS_CONFIGURATION."
      - "redis, kafkajs and @clickhouse/client are optional integrations enabled only by REDIS_URL / KAFKA_URL / CLICKHOUSE_URL; PostgreSQL alone runs the app."
      - "docker-compose.yml: umami + postgres:15 sidecar; the named volume belongs to the sidecar."
