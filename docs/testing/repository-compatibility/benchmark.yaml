      - "No required env var lacks a default: SECRET_KEY_BASE is auto-generated and persisted to WORKDIR/docuseal.env by config/dotenv.rb when not supplied (or read from AWS Secrets Manager via AWS_SECRET_MANAGER_ID if set) — so a fresh import boots without the vendor setting anything beyond what Deployz already injects. RAILS_ENV/NODE_ENV are baked into the Dockerfile."
      - "unsupported: [] — no MySQL/Mongo/SQLite-only requirement (Postgres is the configured choice), no Redis cluster/TLS requirement (self-hosted plain Redis, or Deployz's optional single-node Redis both work), no declared separate worker process, no Kafka/RabbitMQ/SQS, no k8s/terraform/serverless/GPU/Azure/GCP-only deployment. docker-compose.yml's 'caddy' service is a TLS-terminating reverse proxy in front of the single app image, not a second application container."
      - "runtime/monorepo: single Ruby (Rails) app at repo root; package.json exists only for the Shakapacker/Tailwind JS asset pipeline consumed by the same Dockerfile build, not a separate deployable service. monorepo:false."
