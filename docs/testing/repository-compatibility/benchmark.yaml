    notes:
      - "docker/images/docker-compose.yaml declares four application containers built from this repository's own Dockerfiles/source: penpot-frontend (nginx + compiled SPA, port 8080/9001), penpot-backend (Clojure/JVM API+websockets, depends_on postgres+valkey), penpot-mcp (MCP server image), penpot-exporter (Clojure/JS export worker service using headless rendering, depends_on valkey). Four custom application containers, none of them database/cache sidecars or one-shot jobs -> unsupported: [docker-compose-multi-service], well over the 2+ threshold; this alone makes the repository NOT_COMPATIBLE regardless of any single service's own readiness."
      - docker/images/Dockerfile.backend and Dockerfile.frontend both COPY a prebuilt bundle directory (ARG BUNDLE_PATH='./bundle-backend/' / './bundle-frontend/') that does not exist in this repository and is produced by a separate, out-of-Dockerfile build step (backend/scripts/build, frontend/scripts/build, wired through .github/workflows/build-bundle.yml) — neither Dockerfile builds its image from the repository alone. Noted for completeness; the multi-service finding is the controlling one.
      - "penpot-backend picked as dockerfilePath (the core application/API); its default listen port is 6060 (backend/src/app/http.clj: {::port 6060 ...}, ::sm/int, overridable via PENPOT_HTTP_SERVER_PORT-style config)."
      - "Health: backend/src/app/http/debug.clj defines health-handler and mounts it at both '/health' (line ~959) and '/readyz' (line ~971)."
      - "Postgres required (PENPOT_DATABASE_URI in compose, postgres:15 service); Redis/Valkey required for websocket notifications and exporter job state (PENPOT_REDIS_URI, both backend and exporter depend on penpot-valkey) -> redis: true, not optional."
      - "Storage: compose comments show PENPOT_OBJECTS_STORAGE_BACKEND defaulting to 'fs' (local docker volume) with a documented alternative 'PENPOT_OBJECTS_STORAGE_BACKEND: s3' block -> local-disk default with S3 option -> storage: true."
      - "Worker/background jobs: penpot-exporter is a distinct application container that consumes export jobs via Valkey (PENPOT_EXPORTER_MAX_CONCURRENT_JOBS etc.) — this is itself one of the 4 app containers counted above, so it is folded into docker-compose-multi-service rather than double-counted as background-worker; backend/src/app/migrations.clj and the SQL migrations under backend/src/app/migrations/sql/ apply automatically at backend startup -> migration: true, worker: true (job-processing code exists)."
      - "monorepo: true — frontend/, backend/, exporter/, media-processor/, mcp/, library/, render-wasm/, plugins/ are independently versioned, independently built sub-projects (separate package.json/deps.edn/Cargo.toml each) sharing one repository."
