# Stage B per-repository vendor configuration and wave membership.
# Schema and cross-checks: scripts/repository-deployment/config.ts.
#
# Every entry references a Stage A id (docs/testing/repository-compatibility/
# benchmark.yaml) and adds only what a vendor could set through the product:
# `overrides` (PATCH /api/applications/:id), `config` (non-secret values the
# vendor types into the Configuration screen; `${DEPLOYZ_APP_URL}` stands for
# the deployment's permanent default-HTTPS address), `secrets` (keys the
# harness generates at run time — values are never stored; an object form
# names the format the app validates), `verify` (what Stage B probes) and
# `dependencies` (which checks to run). `fork` names the copy the vendor
# GitHub App installation can read; default instashop-dev/<repo>.
#
# `smoke`: a list of repository-specific checks run against the live
# application after HTTPS is ACTIVE. A generic 200 is not enough — each check
# needs `bodyIncludes` and/or `jsonPath` (a status-only check is refused at
# load time). Fields: `path` (must start with /), `method` (GET only, the
# default), `status` (one code or a list of accepted codes), `bodyIncludes`
# (a substring the response body must contain), `jsonPath` (a dot path into
# the JSON body, e.g. `data.ok`), `jsonEquals` (the value at `jsonPath` must
# equal this; when omitted the value must exist and not be null), `exercises`
# (`postgres` and/or `redis` — a failing check marks that dependency FAIL),
# `graceSeconds` (wait before the first try, default 0), `retries` (default
# 3) and `retryDelaySeconds` (default 20). `--require-smoke` refuses a
# repository with no `smoke` entry before anything is created.
#
# Values here are what the Stage A notes establish as the app's own
# requirements. Nothing here patches a repository; a key the analyser wrongly
# demands is still provided (a vendor would have to), and the mismatch is the
# gate audit's finding, not the configuration's.
#
# Three-class deployment model (README "Three-class model"):
#   B1 runtime-reuse (default):  build/release/deploy against a shared standing
#     installation. Never creates fresh AWS infrastructure.
#   B2 capability-cohort:         fresh infrastructure for repos covering each
#     capability cohort (PostgreSQL, Redis, PostgreSQL+Redis, storage, custom
#     Dockerfile, custom port, custom health check, special topology).
#   B3 fresh-full:                full funnel through fresh AWS (build → ECR →
#     bootstrap → install → healthy → destroy → cleanup audit).
#
# b2Repos and b3Repos are explicit, disjoint lists. Everything else defaults
# to B1. A per-repo deploymentClass override in the repository entry takes
# precedence over these lists.
#
# Coverage claim (verified at load time — no overlap allowed):
#   PostgreSQL        ✓ 001, 003, 004, 007, 008, 016, 021, 039, 051, 035
#   Redis             ✓ 007, 016, 002
#   Storage           ✓ 016
#   Custom Dockerfile ✓ 004, 039
#   Custom port       ✓ 004
#   Custom health     ✓ 003, 008
#   Special topology  ✓ 022 (background worker)
version: 1
b2Repos:
  # Rails, PostgreSQL, custom fork — framework-specific build (realistic)
  - repo-051
  # Flask, PostgreSQL — Python cohort rep (realistic)
  - repo-035
  # ToolJet — special application topology via background worker (realistic)
  - repo-022
b3Repos:
  # 10 representative repos covering the widest capability and cohort spread.
  # Each is a distinct app type, runtime, or dependency profile. All have
  # explicit vendor config in the repositories section below.
  - repo-001  # Next.js + Prisma, PostgreSQL, realistic
  - repo-003  # Node/Express, PostgreSQL, custom health, realistic
  - repo-004  # Go, custom Dockerfile, custom port, realistic
  - repo-007  # NestJS + Prisma, PostgreSQL + Redis, realistic
  - repo-008  # Go (scratch image), custom health, realistic
  - repo-016  # Koa/Sequelize, PostgreSQL + Redis + storage, realistic
  - repo-021  # Node, PostgreSQL, heavy config, realistic
  - repo-039  # Go, custom Dockerfile, PostgreSQL, messy
  - repo-002  # Python, Redis, worker, boundary, NOT_COMPATIBLE
  - repo-005  # boundary, NOT_COMPATIBLE

waves:
  wave-1: [repo-008, repo-001, repo-051, repo-004, repo-035, repo-003, repo-007, repo-021, repo-039, repo-016]
  regional-w1: [repo-008, repo-004]
  regional-w2: [repo-001, repo-016]
  regional-w3: [repo-051, repo-092]
  regional-w4: [repo-021, repo-018]
  regional-w5: [repo-026, repo-012]

repositories:
  - id: repo-008
    findings: [DEPLOY-002, DEPLOY-006]
    config:
      - { key: BASE_URL, value: "${DEPLOYZ_APP_URL}" }
    verify: { healthPath: /health, appPath: / }
    smoke:
      - { path: /health, status: 200, jsonPath: status, jsonEquals: UP }
      - { path: /, status: 200, bodyIncludes: "Health Dashboard | Gatus" }
    notes:
      - "Go binary in a scratch image (no shell, no curl); config.yaml baked in. Port 8080 from ENV PORT / EXPOSE; health api/api.go /health."
      - "BASE_URL is demanded by the gate (COMP-016 residual); the app does not need it. Provided so the funnel measures the deployment path."
      - "Campaign 2026-09-18: sentinel, eu-north-1. /health body {\"status\":\"UP\"} (TwiN/health, api/api.go:95-98); / title from config/ui/ui.go:13."

  - id: repo-001
    findings: [DEPLOY-002, DEPLOY-007]
    config:
      - { key: CLOUD_MODE, value: "" }
      - { key: CLICKHOUSE_URL, value: "" }
      - { key: KAFKA_URL, value: "" }
      - { key: KAFKA_BROKER, value: "" }
      - { key: KAFKA_MAX_MESSAGE_BYTES, value: "" }
    verify: { healthPath: /api/heartbeat, appPath: /login }
    smoke:
      - { path: /api/heartbeat, status: 200, bodyIncludes: "\"ok\":true" }
      - { path: /login, status: 200, bodyIncludes: "Login | Umami", graceSeconds: 60 }
    notes:
      - "Next.js + Prisma; boots on DATABASE_URL alone (APP_SECRET falls back to it). Migrations run by scripts/start-docker.sh at boot."
      - "The gate demands the optional ClickHouse/Kafka/cloud-mode keys (COMP-023 residual); empty values keep those integrations off, as the app treats an unset key."
      - "Campaign 2026-09-18: us-east-2. @prisma/adapter-pg (node-postgres) — the RDS CA bundle path (DEPLOY-007) is exercised by scripts/check-db.js before prisma migrate deploy."

  - id: repo-051
    findings: [DEPLOY-002]
    fork: instashop-dev/docuseal
    secrets:
      - SIDEKIQ_BASIC_AUTH_PASSWORD
      - { key: SECRET_KEY_BASE, format: hex64 }
    verify: { healthPath: /up, appPath: /setup }
    smoke:
      - { path: /up, status: 200, bodyIncludes: "green" }
      - { path: /setup, status: 200, bodyIncludes: "DocuSeal", exercises: [postgres], graceSeconds: 60 }
    notes:
      - "Rails; reads DATABASE_HOST/PORT/USER/PASSWORD/NAME (Deployz's own names). Migrations at boot (config/initializers/migrate.rb). Storage stays on local disk (S3 is optional via S3_ATTACHMENTS_BUCKET)."
      - "Campaign 2026-09-18: ca-central-1. SECRET_KEY_BASE is otherwise auto-generated onto the task's ephemeral disk (config/dotenv.rb:179-207); a generated secret keeps sessions and ActiveRecord encryption stable across task replacement. Without REDIS_URL the container forks its own redis-server (lib/puma/plugin/redis_server.rb). / redirects to /setup while no user exists (application_controller.rb:78-80)."

  - id: repo-004
    findings: [DEPLOY-008, DEPLOY-026, DEPLOY-027, DEPLOY-028]
    fork: instashop-dev/v2
    overrides:
      dockerfilePath: packaging/docker/alpine/Dockerfile
      buildContext: .
      containerPort: 8080
      healthPath: /healthcheck
    config:
      - { key: RUN_MIGRATIONS, value: "1" }
      - { key: CREATE_ADMIN, value: "1" }
      - { key: ADMIN_USERNAME, value: admin }
      - { key: BASE_URL, value: "${DEPLOYZ_APP_URL}" }
    secrets:
      - { key: ADMIN_PASSWORD, format: password }
    verify: { healthPath: /healthcheck, appPath: / }
    smoke:
      - { path: /healthcheck, status: 200, bodyIncludes: "OK", exercises: [postgres] }
      - { path: /, status: 200, bodyIncludes: "login" }
    notes:
      - "Go; reads DATABASE_URL. The Dockerfile under packaging/docker/alpine copies the repository root, so the build context is the root, not the Dockerfile's directory."
      - "Campaign 2026-09-18: us-east-1. /healthcheck answers OK only after store.Ping() (internal/http/server/healthcheck.go:12-27); lib/pq sslmode=require does not verify the CA."

  - id: repo-035
    findings: []
    secrets: [SECRET_KEY]
    verify: { healthPath: /healthcheck, appPath: / }
    notes:
      - "Flask; reads SQLALCHEMY_DATABASE_URI (a full postgresql:// URI) — the injected DATABASE_URL must reach it under that name. Migrations run at boot."

  - id: repo-003
    findings: [DEPLOY-005, DEPLOY-007, DEPLOY-009, DEPLOY-010, DEPLOY-011, DEPLOY-012, DEPLOY-013]
    fork: instashop-dev/kutt
    overrides:
      healthPath: /api/health
    config:
      - { key: DB_CLIENT, value: pg }
      - { key: DB_SSL, value: "true" }
      - { key: ADMIN_EMAILS, value: admin@example.com }
    secrets: [JWT_SECRET]
    verify: { healthPath: /api/health, appPath: / }
    notes:
      - "Node/Express; PostgreSQL is selected with DB_CLIENT=pg and read from DB_HOST/DB_PORT/DB_NAME/DB_USER/DB_PASSWORD (no DATABASE_URL). RDS forces TLS, hence DB_SSL. Health is /api/health; the analyser's /health is wrong (COMP-005)."

  - id: repo-007
    fork: instashop-dev/ghostfolio
    secrets: [ACCESS_TOKEN_SALT, JWT_SECRET_KEY]
    verify: { healthPath: /api/v1/health, appPath: / }
    notes:
      - "NestJS + Prisma; reads DATABASE_URL and REDIS_HOST/REDIS_PORT (Redis required: Bull + the health check). Migrations run by docker/entrypoint.sh at boot. Port 3333."
    findings: [DEPLOY-014]

  - id: repo-021
    findings: [DEPLOY-005]
    overrides:
      healthPath: /server/ping
    config:
      - { key: DB_CLIENT, value: pg }
      - { key: DB_SSL, value: "true" }
      - { key: DB_SSL__REJECT_UNAUTHORIZED, value: "false" }
      - { key: ADMIN_EMAIL, value: admin@example.com }
      - { key: PUBLIC_URL, value: "${DEPLOYZ_APP_URL}" }
      - { key: PM2_EXEC_MODE, value: fork }
    secrets:
      - { key: KEY, format: hex32 }
      - { key: SECRET, format: hex64 }
      - { key: ADMIN_PASSWORD, format: password }
    verify: { healthPath: /server/ping, appPath: /admin/login }
    smoke:
      - { path: /server/ping, status: 200, bodyIncludes: pong }
      - { path: /server/info, status: 200, jsonPath: data.project, exercises: [postgres], graceSeconds: 30 }
      - { path: /admin/login, status: 200, bodyIncludes: Directus }
    notes:
      - "Node; PostgreSQL via DB_CLIENT=pg with DB_HOST/DB_PORT/DB_DATABASE/DB_USER/DB_PASSWORD (or DB_CONNECTION_STRING). Migrations run at boot (docker-entrypoint.cjs runs directus bootstrap). Port 8055."
      - "Campaign 2026-09-18: eu-central-1. /server/health answers 403 to unauthenticated callers (api/src/services/server.ts:223-225; upstream e2e health.test.ts:42-50), so the health path is /server/ping (api/src/app.ts:319). /server/info is public and reads directus_settings (services/server.ts:57-62). PM2_EXEC_MODE=fork avoids pm2 cluster's second Node process."

  - id: repo-039
    findings: [DEPLOY-005, DEPLOY-008, DEPLOY-015, DEPLOY-016]
    overrides:
      dockerfilePath: scripts/Dockerfile
      buildContext: .
      containerPort: 5230
      healthPath: /healthz
    config:
      - { key: MEMOS_DRIVER, value: postgres }
    verify: { healthPath: /healthz, appPath: / }
    notes:
      - "Go; PostgreSQL is selected with MEMOS_DRIVER=postgres and read from MEMOS_DSN (a connection string). Migrations run at boot. The Dockerfile ships the backend with a stub frontend page (Stage A note); health and API still answer."

  - id: repo-016
    findings: [DEPLOY-005]
    config:
      - { key: URL, value: "${DEPLOYZ_APP_URL}" }
      - { key: FORCE_HTTPS, value: "false" }
      - { key: FILE_STORAGE, value: local }
      - { key: WEB_CONCURRENCY, value: "1" }
    secrets:
      - { key: SECRET_KEY, format: hex64 }
      - UTILS_SECRET
    dependencies: { storage: skip }
    verify: { healthPath: /_health, appPath: / }
    smoke:
      - { path: /_health, status: 200, bodyIncludes: "OK", exercises: [postgres, redis], graceSeconds: 60 }
    notes:
      - "Node (Koa/Sequelize); reads DATABASE_URL and REDIS_URL, needs URL, SECRET_KEY (64 hex) and UTILS_SECRET at boot. Migrations run automatically by the throng master before the workers start (server/index.ts:33-36, server/scripts/checkMigrations.ts)."
      - "FILE_STORAGE code default is s3 (server/env.ts:722-724); local is explicit so the PostgreSQL + Redis path is measured on its own. WEB_CONCURRENCY=1 stops throng from forking one worker per host CPU."
      - "Campaign 2026-09-18: eu-west-1. /_health runs SELECT 1 and a Redis PING (server/main.ts:78-90). Upstream Dockerfile is FROM outlinewiki/outline-base (untagged): the deployed code may trail the pinned commit — an upstream characteristic."

  - id: repo-002
    findings: [DEPLOY-002]
