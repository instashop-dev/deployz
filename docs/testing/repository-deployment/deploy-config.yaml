  - id: repo-018
    deploymentClass: fresh-full
    findings: []
    fork: instashop-dev/docmost
    overrides:
      healthPath: /api/health
    config:
      - { key: APP_URL, value: "${DEPLOYZ_APP_URL}" }
    secrets:
      - { key: APP_SECRET, format: hex32 }
    dependencies: { storage: skip }
    verify: { healthPath: /api/health, appPath: /api/health/live }
    smoke:
      - { path: /api/health, status: 200, jsonPath: status, jsonEquals: ok, exercises: [postgres, redis], graceSeconds: 60 }
      - { path: /api/health/live, status: 200, jsonPath: data, jsonEquals: ok }
    notes:
      - "Node (Nest/Fastify, pnpm + nx monorepo); reads DATABASE_URL and REDIS_URL verbatim (apps/server/src/integrations/environment/environment.service.ts:48-60); APP_SECRET >= 32 chars (environment.validation.ts:43-46). Migrations run in onApplicationBootstrap when NODE_ENV=production (database.module.ts:131-137). Port 3000."
      - "postgres.js with sslmode=require does not verify the CA (DEPLOY-007 moot). STORAGE_DRIVER stays local for this campaign (S3 needs AWS_S3_REGION/AWS_S3_BUCKET)."
      - "Campaign 2026-09-18: ap-south-1. /api/health pings PostgreSQL and Redis (health.controller.ts:19-22); the analyser's health path was / (manifest) — overridden to /api/health."

  - id: repo-012
    deploymentClass: fresh-full
    findings: []
    fork: instashop-dev/zipline
    config:
      - { key: FFMPEG_PATH, value: "" }
      - { key: ZIPLINE_OVERRIDE_DISABLED_WORKER_LOG, value: "" }
    secrets:
      - { key: CORE_SECRET, format: hex64 }
    dependencies: { storage: skip }
    verify: { healthPath: /api/healthcheck, appPath: /dashboard }
    smoke:
      - { path: /api/healthcheck, status: 200, jsonPath: pass, jsonEquals: true, exercises: [postgres] }
      - { path: /api/setup, status: 200, jsonPath: firstSetup, jsonEquals: true, exercises: [postgres] }
      - { path: /dashboard, status: 200, bodyIncludes: "<title>Zipline</title>" }
    notes:
      - "Node; reads DATABASE_URL first (src/lib/db/index.ts:19-26) over drizzle + node-postgres 8.16 — the RDS CA bundle path (DEPLOY-007) is required. CORE_SECRET >= 32 chars (src/lib/config/validate.ts:97-110). Migrations run in-process before listen (src/server/index.ts:36-46). Port 3000."
      - "DATASOURCE_TYPE stays local: the S3 datasource hard-codes static credentials (src/lib/datasource/S3.ts:48-51) and cannot use the task role."
      - "The gate demands FFMPEG_PATH / ZIPLINE_OVERRIDE_DISABLED_WORKER_LOG (DEPLOY-002 residual); empty values are the unset behaviour."
      - "Campaign 2026-09-18: ap-southeast-1. /api/setup answers firstSetup:true only while no admin exists (routes/api/setup.ts:37-40)."

  - id: repo-026
    deploymentClass: fresh-full
    findings: []
    fork: instashop-dev/reactive-resume
    overrides:
      healthPath: /api/health
    config:
      - { key: APP_URL, value: "${DEPLOYZ_APP_URL}" }
    secrets:
      - { key: AUTH_SECRET, format: hex64 }
    dependencies: { storage: skip }
    verify: { healthPath: /api/health, appPath: / }
    smoke:
      - { path: /api/health, status: 200, jsonPath: status, jsonEquals: healthy, exercises: [postgres], graceSeconds: 60 }
      - { path: /, status: 200, bodyIncludes: "Reactive Resume" }
      - { path: /schema.json, status: 200, jsonPath: type, jsonEquals: object }
    notes:
      - "Node (Hono API serving the Vite SPA, pnpm + turborepo); reads DATABASE_URL only (packages/env/src/server.ts:26) over drizzle + node-postgres — the RDS CA bundle path (DEPLOY-007) is required. APP_URL and AUTH_SECRET are required with no default. Migrations run before the server listens (apps/server/src/startup/checks.ts:80-84). Port 3000."
      - "Storage stays on LOCAL_STORAGE_PATH (/app/data): S3 needs static S3_ACCESS_KEY_ID/S3_SECRET_ACCESS_KEY (checks.ts:46). REDIS_URL and ENCRYPTION_SECRET are optional."
      - "Campaign 2026-09-18: us-west-2. The app has no /health; the ALB path is /api/health (apps/server/src/http/app.ts:41), which runs SELECT 1 and a storage check."
