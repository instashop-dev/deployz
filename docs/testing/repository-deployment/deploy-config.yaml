  - id: repo-092
    deploymentClass: fresh-full
    findings: [DEPLOY-002]
    fork: instashop-dev/dashy
    config:
      - { key: API_TOKEN, value: "" }
      - { key: IS_SERVER, value: "" }
      - { key: VUE_APP_CONFIG_VALID, value: "" }
    verify: { healthPath: /healthz, appPath: / }
    smoke:
      - { path: /healthz, status: 200, jsonPath: status, jsonEquals: ok }
      - { path: /, status: 200, bodyIncludes: "<title>Dashy</title>" }
    notes:
      - "Node (Express) serving a prebuilt Vue SPA; no database, no Redis, no required env (services/app.js). Port 8080 (Dockerfile ENV PORT=8080). Health /healthz returns {status:ok,uptime,version} (services/app.js:249-255)."
      - "The gate demands API_TOKEN / IS_SERVER / VUE_APP_CONFIG_VALID (DEPLOY-002 residual); empty values are the unset behaviour."
      - "Campaign 2026-09-18: ap-southeast-2. The one no-database case whose analysis is correct (postgres:false)."

