# Normal vendor configuration for the Phase 3 local builds (P3-BUILD-PLAN, Opus, 2026-10-09).
# Overrides are the readiness answers a vendor gives for its own app: the labelled
# appRoot, Dockerfile, port, health path and managed services. No secret values.
# A P3-BUILD-nn worker may add documented config keys and generated secret keys
# for its own apps only, and records the source of each addition.
version: 1
