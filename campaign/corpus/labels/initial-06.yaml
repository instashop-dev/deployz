# Initial expected-behavior labels for corpus batch 6 (repo-551..repo-560).
# Labeled from repository source only at the pinned commits (GitHub API reads);
# no Deployz analysis output was read or run. Labels state what Deployz SHOULD
# conclude under docs/product/mvp-scope.md, not what it does today.
# Conventions:
#  - NOT_COMPATIBLE: needs persistent local disk state (SQLite file, data dir,
#    mounted media/config volume) or has no usable self-contained Dockerfile.
#  - NEEDS_CONFIGURATION: runs on the supported architecture only after vendor
#    config (database URL, secrets, storage, bind host).
#  - READY: the image runs with no required configuration.
#  - postgres true when PostgreSQL is a supported production DB of the app.
#  - redis true only when the app needs it. worker true only for a declared
#    separate background process. storage true when the app can use S3.
#  - migration true when an explicit migration command is in entrypoint/scripts.
#  - unsupported uses UNSUPPORTED_FAMILIES names plus "local-filesystem"
#    (also used for embedded SQLite / data dir; SQLite has no family name).
taskId: P1-LABEL-06
testedCommit: e6a3b58ee2363923fef21faca86611fa3bf84538
labeledAt: 2026-10-08T00:00:00Z
