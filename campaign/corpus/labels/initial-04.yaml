# P1-LABEL-04 initial expected-behavior labels, batch 4 (repo-531..repo-540).
# Labeled from repository source at the pinned commits only (gh api); no Deployz analysis or result was read.
# Conventions:
# - Labels state what Deployz SHOULD conclude under docs/product/mvp-scope.md, not what it does today.
# - compatibility: NOT_COMPATIBLE when the application needs persistent local disk state (SQLite file, data
#   directory, mounted media/config volume) or has no Dockerfile; NEEDS_CONFIGURATION when it can run on the
#   supported architecture but only after vendor config (database URL, bind host, storage disk, start command);
#   READY when the image runs with no required configuration.
# - postgres is true when PostgreSQL is a supported production database of the app (an SQLite default does not
#   make it false, because Deployz hosts only PostgreSQL/MySQL). redis is true only when the app needs it.
# - worker is true when the repo declares a separate background process (supervisor program, compose service,
#   Procfile entry), even if the default image starts it in-process.
# - storage is true when the app can use S3 object storage. migration is true when the repo has an explicit
#   migration command in its entrypoint or scripts; schema changes done inside server startup count as false.
# - port and healthPath come from the Dockerfile/server code; healthPath is omitted if no unauthenticated endpoint exists.
# - unsupported uses UNSUPPORTED_FAMILIES names plus "local-filesystem". appRoot equals the slice appPath.
# - citations map each expected key to at least one {path, reason}; every path exists at the pinned commit.
