apps:
  - id: repo-501
    repo: fastapi/full-stack-fastapi-template
    commit: f27b4721507824e57ebd0286ff1a84d82e83bf59
    expected:
      compatibility: READY
      runtime: [python]
      monorepo: true
      postgres: true
      redis: false
      worker: false
      migration: true
      appRoot: backend
      dockerfilePath: backend/Dockerfile
      port: 8000
      healthPath: /api/v1/utils/health-check/
    citations:
      compatibility:
        - path: backend/Dockerfile
          reason: Dockerfile builds the API with fastapi run; no unsupported component in the web path.
        - path: compose.yml
          reason: Only db, backend, proxy and adminer; proxy and adminer are dev or edge helpers, no extra app service.
      runtime:
        - path: backend/pyproject.toml
          reason: Python project with fastapi and sqlmodel dependencies.
      monorepo:
        - path: pyproject.toml
          reason: Root uv workspace with backend and frontend packages; Dockerfile builds from the repo root.
      postgres:
        - path: backend/pyproject.toml
          reason: psycopg dependency.
        - path: compose.yml
          reason: db service is postgres:18 and DATABASE_URL is postgresql.
      redis:
        - path: backend/pyproject.toml
          reason: No redis client dependency.
      worker:
        - path: compose.yml
          reason: No worker, queue or scheduler service.
      migration:
        - path: backend/scripts/prestart.sh
          reason: Runs alembic upgrade head before start.
      appRoot:
        - path: backend
          reason: Slice appPath is backend; it holds pyproject.toml and the Dockerfile.
      dockerfilePath:
        - path: backend/Dockerfile
          reason: Only Dockerfile of the API; its build context is the repo root.
      port:
        - path: compose.yml
          reason: Traefik label sets backend server port 8000 and healthcheck uses localhost:8000.
      healthPath:
        - path: backend/app/api/routes/utils.py
          reason: Route /health-check/ under the /api/v1/utils prefix.
