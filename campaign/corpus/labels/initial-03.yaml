# Initial expected-behavior labels, corpus batch 3 (repo-521 .. repo-530).
# Labeled from repository source only, at the pinned commits, against docs/product/mvp-scope.md.
# No Deployz analysis output was read or used.
#
# Conventions
# - expected = what Deployz SHOULD conclude for the target app, not what it does today.
# - appRoot and dockerfilePath are relative to the repository root. "." is the root.
# - dockerfilePath is omitted when no Dockerfile exists for the target app (a template such as
#   Dockerfile.tpl is not a Dockerfile). A Dockerfile that exists but cannot build is still listed.
# - runtime uses the runtime family names of the analysis contract (node, python, ruby, go, jvm,
#   dotnet, php, elixir, rust).
# - compatibility: READY = deploys with no vendor input; NEEDS_CONFIGURATION = deployable after a
#   vendor setting or env mapping; NOT_COMPATIBLE = an MVP non-goal blocks it.
# - postgres/redis/worker are true only when the app needs them in the target setup. An optional
#   cache or optional backend that the app can run without is false. worker is true only for a
#   declared separate start command (Procfile, compose command) that shares the one image.
# - storage true = the app stores user files and has an S3 backend option, so the Deployz bucket
#   would be used. It does not mean the app is compatible. false = no S3 option.
# - migration true = the repository defines a command that applies schema migrations on deploy.
#   false = no such command (schema is created by the app itself or by an installer UI).
# - monorepo true = the repository holds several packages or modules next to the target app.
# - unsupported lists family names from UNSUPPORTED_FAMILIES in normalize.ts, plus
#   "local-filesystem" for required persistent local disk state. MySQL is NOT listed as unsupported
#   because mvp-scope.md provisions RDS MySQL 8.0; the schema has no mysql fact, so a MySQL-only
#   app has postgres false.
# - citations: every expected key has at least one {path, reason}; paths exist at the pinned commit.

