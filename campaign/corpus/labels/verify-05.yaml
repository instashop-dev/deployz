  - id: repo-543
    repo: teslamate-org/teslamate
    commit: 96119f65a98ecc2f6d3584c07af4d0b952326daa
    expected:
      compatibility: NEEDS_CONFIGURATION
      runtime:
        - elixir
      monorepo: false
      postgres: true
      redis: false
      worker: false
      storage: false
      migration: true
      dockerfilePath: Dockerfile
      port: 4000
      healthPath: /health_check
    citations:
      compatibility:
        - path: elixir/config/runtime.exs
          reason: Needs DATABASE_* variables and other values, which the vendor or Deployz must set; PostgreSQL is supported.
        - path: Dockerfile
          reason: Dockerfile at root builds the Elixir release.
      runtime:
        - path: elixir/mix.exs
          reason: Elixir Mix project.
      monorepo:
        - path: elixir
          reason: Single application under elixir/ with Rust and website helpers, not a multi-app workspace.
      postgres:
        - path: elixir/mix.exs
          reason: Depends on postgrex and ecto_sql.
        - path: elixir/config/runtime.exs
          reason: Reads DATABASE_HOST, DATABASE_USER, DATABASE_PASS, DATABASE_NAME.
      redis:
        - path: elixir/mix.exs
          reason: No Redis dependency.
      worker:
        - path: entrypoint.sh
          reason: Single process started with bin/teslamate start.
      storage:
        - path: elixir/config/runtime.exs
          reason: No S3 configuration.
      migration:
        - path: entrypoint.sh
          reason: Runs TeslaMate.Release.wait_for_database_and_migrate() before start.
      dockerfilePath:
        - path: Dockerfile
          reason: Root Dockerfile builds from elixir/ subdirectory.
      port:
        - path: Dockerfile
          reason: EXPOSE 4000.
      healthPath:
        - path: elixir/lib/teslamate_web/health_check.ex
          reason: Plug answers 200 on /health_check.
