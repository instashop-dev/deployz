apps:
  - id: repo-541
    repo: Dictionarry-Hub/profilarr
    commit: 7fec444c1dc660b261b72c55a685b9e8f6957ea6
    expected:
      compatibility: NOT_COMPATIBLE
      runtime:
        - deno
      monorepo: false
      postgres: false
      redis: false
      worker: false
      storage: false
      migration: false
      dockerfilePath: Dockerfile
      port: 6868
      healthPath: /api/v1/health
    citations:
      compatibility:
        - path: Dockerfile
          reason: Image keeps all state in a /config volume with SQLite, which is local disk state outside the MVP boundary.
        - path: compose.yml
          reason: Compose file mounts a ./config volume for persistent data.
      runtime:
        - path: deno.jsonc
          reason: Deno project configuration.
        - path: Dockerfile
          reason: Builds with denoland/deno image and deno compile.
      monorepo:
        - path: deno.jsonc
          reason: Single Deno project at the repository root.
      postgres:
        - path: Dockerfile
          reason: Runtime installs sqlite-libs only; no PostgreSQL client or server.
      redis:
        - path: compose.yml
          reason: Compose stack defines no Redis service.
      worker:
        - path: Dockerfile
          reason: Single entrypoint process; no separate worker command.
      storage:
        - path: Dockerfile
          reason: No S3 or object storage use; data is on the /config volume.
      migration:
        - path: Dockerfile
          reason: No separate migration command; SQLite schema is handled in-process.
      dockerfilePath:
        - path: Dockerfile
          reason: Main application Dockerfile at the repository root.
      port:
        - path: Dockerfile
          reason: ENV PORT=6868 and EXPOSE 6868.
      healthPath:
        - path: Dockerfile
          reason: HEALTHCHECK curls /api/v1/health.
