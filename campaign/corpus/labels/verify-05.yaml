      runtime:
        - path: requirements/production.txt
          reason: Python and Django dependencies.
        - path: manage.py
          reason: Django entry point.
      monorepo:
        - path: manage.py
          reason: Single Django project.
      postgres:
        - path: docker-compose.yml
          reason: Postgres service and DATABASE_URL.
        - path: docker-entrypoint.sh
          reason: Waits for Postgres with psql.
      redis:
        - path: bakerydemo/settings/production.py
          reason: Uses REDIS_URL for cache when set.
        - path: docker-compose.yml
          reason: Reference stack has a redis service.
      worker:
        - path: etc/uwsgi.ini
          reason: Single uwsgi web process.
      storage:
        - path: bakerydemo/settings/production.py
          reason: Uses S3 storage when AWS_STORAGE_BUCKET_NAME is set.
      migration:
        - path: docker-entrypoint.sh
          reason: Runs manage.py migrate --noinput before uwsgi.
      dockerfilePath:
        - path: Dockerfile
          reason: Root Dockerfile.
      port:
        - path: Dockerfile
          reason: ENV PORT=8000 and EXPOSE 8000.
