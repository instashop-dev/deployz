# Initial expected-behavior labels, corpus batch 7 (P1-LABEL-07).
# Source-only labels from the pinned commit. They state what Deployz SHOULD
# conclude under docs/product/mvp-scope.md, not what Deployz does today.
#
# Conventions
# - compatibility: READY = deploys with no vendor input beyond managed values.
#   NEEDS_CONFIGURATION = deployable, but the vendor must set a start command,
#   secrets, or a requirement the repo does not declare. NOT_COMPATIBLE = an
#   MVP non-goal blocks it (persistent volume, local disk state, unsupported
#   database, Docker daemon, no buildable Dockerfile).
# - postgres: the app supports PostgreSQL as a database in a real deployment
#   (the production option), even when the default is SQLite or memory.
# - redis: the app needs Redis in its documented deployment. An optional cache
#   or queue driver that the default setup does not use is false.
# - worker: a separate long-running background process is required and the repo
#   shows a start command for it. A worker that runs inside the web container
#   by default is false.
# - storage: the app stores user files or object data (local disk or S3).
# - migration: the repo declares a distinct migration command or script. A
#   migration that only runs inside app startup with no named command is false.
# - monorepo: the repo holds more than one independently deployable app or
#   workspace package set. A multi-module build with one deployable is false.
# - unsupported: names from UNSUPPORTED_FAMILIES values, plus "local-filesystem".
# - appRoot, dockerfilePath, port, healthPath are set only when the source shows them.
taskId: P1-LABEL-07
