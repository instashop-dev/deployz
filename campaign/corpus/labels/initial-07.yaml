      storage: true
      migration: false
      dockerfilePath: Dockerfile
      port: 8080
      unsupported: [local-filesystem]
    citations:
      compatibility:
        - path: docker-compose.yml
          reason: The reference setup mounts a kestra-data volume at /app/storage and the Docker socket, and sets storage type local.
        - path: Dockerfile
          reason: The root Dockerfile only adds plugins to a prebuilt base image. CMD is --help, so the start command is not in the image.
      runtime:
        - path: build.gradle
          reason: Gradle multi-module JVM build.
      monorepo:
        - path: build.gradle
          reason: Many Gradle modules build one Kestra server distribution; the ui package is bundled into it.
      postgres:
        - path: docker-compose.yml
          reason: Reference setup uses postgres as repository and queue backend.
      redis:
        - path: docker-compose.yml
          reason: No Redis service or setting in the reference setup.
      worker:
        - path: docker-compose.yml
          reason: Single "server standalone" command runs the worker in the same process.
      storage:
        - path: storage-local/build.gradle
          reason: Local storage module is the default; the compose file stores files under /app/storage.
      migration:
        - path: docker-compose.yml
          reason: No separate migration command; the schema is managed at startup.
      dockerfilePath:
        - path: Dockerfile
          reason: Root Dockerfile.
      port:
        - path: docker-compose.yml
          reason: Maps port 8080.
      unsupported:
        - path: docker-compose.yml
          reason: kestra-data volume at /app/storage, local storage base-path, and /tmp/kestra-wd mount are local disk state.
