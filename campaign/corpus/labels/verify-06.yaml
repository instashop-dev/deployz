    commit: 45578dd32121319c28d3bc5abffa70c225631eb2
    expected:
      compatibility: READY
      runtime:
        - node
      monorepo: true
      postgres: true
      redis: false
      worker: false
      storage: false
      migration: true
      dockerfilePath: Dockerfile
