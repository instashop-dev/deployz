  - id: repo-556
    repo: muety/wakapi
    commit: a8d88056932881329845609a749025a1513564db
    expected:
      compatibility: NEEDS_CONFIGURATION
      runtime:
        - go
      monorepo: false
      postgres: true
      redis: false
      worker: false
      storage: false
      migration: false
      dockerfilePath: Dockerfile
      port: 3000
      healthPath: /api/health
    citations:
      compatibility:
        - path: Dockerfile
          reason: Image defaults to SQLite at /data; Postgres needs WAKAPI_DB_* env vars, which the vendor must map.
      runtime:
        - path: go.mod
          reason: Go module.
      monorepo:
        - path: go.mod
          reason: Single Go module.
      postgres:
        - path: config.default.yml
          reason: Supports postgres dialect via db.dialect / WAKAPI_DB_TYPE; not default.
      redis:
        - path: go.mod
          reason: No Redis client.
      worker:
        - path: main.go
          reason: Scheduled jobs run in process.
      storage:
        - path: config.default.yml
          reason: No object storage settings.
      migration:
        - path: config.default.yml
          reason: skip_migrations option; migrations run in process at startup.
      dockerfilePath:
        - path: Dockerfile
          reason: Root Dockerfile.
      port:
        - path: Dockerfile
          reason: EXPOSE 3000.
      healthPath:
        - path: routes/api/health.go
          reason: Registers GET /health under the /api router; scripts/healthcheck.go calls /api/health.
    uncertainties:
      - Postgres only if vendor sets WAKAPI_DB_TYPE=postgres plus host/user/password/name; Wakapi does not read DATABASE_URL.
      - With default SQLite the repo would be NOT_COMPATIBLE.
