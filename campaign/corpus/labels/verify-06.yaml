    citations:
      compatibility:
        - path: docker-compose.yml
          reason: "Env-driven config: DATABASE_URL (postgres supported) and REDIS_URL; no required mounts if Postgres is used."
      runtime:
        - path: package.json
          reason: SvelteKit app on Node 24.
      monorepo:
        - path: package.json
          reason: Single package.
      postgres:
        - path: knexfile.ts
          reason: Knex reads DATABASE_URL; supports postgresql://; default is SQLite.
      redis:
        - path: docker-compose.yml
          reason: "Comment: Redis is required for BullMQ queues, caching and scheduler."
      worker:
        - path: knexfile.ts
          reason: Web and BullMQ workers share one process (two DB pools).
      storage:
        - path: Dockerfile
          reason: Only local database dir used for SQLite; no object storage.
      migration:
        - path: scripts/main.ts
          reason: db.migrate.latest() runs at startup inside the app.
      dockerfilePath:
