      runtime:
        - path: package.json
          reason: Node, pnpm workspace.
      monorepo:
        - path: pnpm-workspace.yaml
          reason: pnpm workspace with src/client, src/server and others.
      postgres:
        - path: src/server/prisma/schema.prisma
          reason: Prisma provider postgresql.
      redis:
        - path: src/server/utils/env.ts
          reason: redisUrl is optional; memory cache otherwise.
      worker:
        - path: Dockerfile
          reason: One CMD launches a single server process; cron/monitors run in-process.
      storage:
        - path: src/server/utils/env.ts
          reason: No S3 settings in env config.
      migration:
        - path: Dockerfile
          reason: CMD runs prisma migrate deploy before starting server.
      dockerfilePath:
        - path: Dockerfile
          reason: Root Dockerfile.
      port:
        - path: Dockerfile
          reason: EXPOSE 12345.
      healthPath:
        - path: src/server/router/health.ts
