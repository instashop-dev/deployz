  - id: repo-560
    repo: rajnandan1/kener
    commit: 74a6228b862f276c4f42177b340ae997fe9dfca2
    expected:
      compatibility: READY
      runtime:
        - node
      monorepo: false
      postgres: true
      redis: true
      worker: false
      storage: false
      migration: false
      dockerfilePath: Dockerfile
