apps:
  - id: repo-551
    repo: spliit-app/spliit
    commit: b73d551a6dea3a27f3d5d42a805b86edcb1ee651
    expected:
      compatibility: READY
      runtime:
        - node
      monorepo: false
      postgres: true
      redis: false
      worker: false
      storage: true
      migration: true
      dockerfilePath: Dockerfile
      port: 3000
      healthPath: /api/health
    citations:
      compatibility:
        - path: Dockerfile
          reason: Self-contained multi-stage Dockerfile; standalone Next.js server, no mounted volumes or config files needed.
      runtime:
        - path: package.json
          reason: Next.js app, engines node >=24, npm lockfile.
      monorepo:
        - path: package.json
          reason: Single package, no workspaces.
      postgres:
        - path: prisma/schema.prisma
          reason: Prisma datasource provider is postgresql.
      redis:
        - path: package.json
          reason: No Redis dependency; compose.yaml has only app and postgres db.
      worker:
        - path: scripts/container-entrypoint.sh
          reason: Entrypoint runs migrate deploy then one node server.js; no worker process.
      storage:
        - path: .env.example
          reason: Optional S3 upload (ENABLE_EXPENSE_DOCUMENTS, S3_UPLOAD_* vars); opt-in feature.
      migration:
        - path: scripts/container-entrypoint.sh
          reason: Runs prisma migrate deploy at container start.
      dockerfilePath:
        - path: Dockerfile
          reason: Root Dockerfile.
      port:
        - path: Dockerfile
          reason: ENV PORT=3000 and EXPOSE 3000/tcp.
      healthPath:
        - path: src/app/api/health/route.ts
          reason: GET /api/health returns readiness incl. DB check.
    uncertainties:
      - Storage is an opt-in S3 feature; label true means code uses S3 but the app runs without it.
      - Migration runs inside the entrypoint, not as a separate vendor command.
  - id: repo-552
    repo: misskey-dev/misskey
    commit: 5f501341d49d2bc3fa7e817ce7548a82174326eb
    expected:
      compatibility: NOT_COMPATIBLE
      runtime:
        - node
      monorepo: true
      postgres: true
      redis: true
      worker: false
      storage: true
      migration: true
      dockerfilePath: Dockerfile
      port: 3000
      healthPath: /healthz
    citations:
      compatibility:
        - path: compose_example.yml
          reason: Mounts ./.config (default.yml) and ./files volumes; config is read from .config/default.yml, which is not in the image.
      runtime:
        - path: package.json
          reason: Node/pnpm workspace; Dockerfile uses node image.
      monorepo:
        - path: pnpm-workspace.yaml
          reason: pnpm workspace with packages/backend, frontend and others.
      postgres:
        - path: .config/example.yml
          reason: "db: section with PostgreSQL host/port/user."
      redis:
        - path: .config/example.yml
          reason: "redis: section is required config; compose_example.yml runs a redis service."
      worker:
        - path: package.json
          reason: start runs a single backend entry (built/entry.js); jobs run in-process.
      storage:
        - path: compose_example.yml
          reason: Drive files stored on a local ./files volume by default.
      migration:
        - path: package.json
          reason: migrateandstart script runs pnpm migrate then start.
      dockerfilePath:
        - path: Dockerfile
          reason: Root Dockerfile.
      port:
        - path: .config/example.yml
          reason: "port: 3000; compose maps 3000."
      healthPath:
        - path: healthcheck.sh
          reason: curl http://localhost:${PORT}/healthz.
    uncertainties:
      - NOT_COMPATIBLE rests on the required mounted .config/default.yml and local files volume (MVP non-goal); a vendor could bake a config file into the image, which would change the verdict.
      - packages/backend/scripts/compile_config.js reads only .config YAML; a few values have env fallbacks but db and redis do not.
  - id: repo-553
    repo: milesmcc/shynet
    commit: ca35caba3af2b888acc990b99152c500a1c44461
    expected:
      compatibility: READY
      runtime:
        - python
      monorepo: false
      postgres: true
      redis: false
      worker: false
      storage: false
      migration: true
      dockerfilePath: Dockerfile
      port: 8080
      healthPath: /healthz/
    citations:
      compatibility:
        - path: Dockerfile
          reason: Self-contained Django image with gunicorn; env-driven config, PostgreSQL via DB_* vars.
      runtime:
        - path: pyproject.toml
          reason: Django app managed with poetry.
      monorepo:
        - path: Dockerfile
          reason: One app under shynet/; single image.
      postgres:
        - path: TEMPLATE.env
          reason: PostgreSQL DB_* settings are the default; SQLite is an opt-in alternative.
      redis:
        - path: TEMPLATE.env
          reason: Redis only for multi-instance setups (commented out).
      worker:
        - path: shynet/shynet/settings.py
          reason: CELERY_TASK_ALWAYS_EAGER defaults True; no separate worker needed for single instance.
      storage:
        - path: shynet/shynet/settings.py
          reason: No S3 or object storage settings.
      migration:
        - path: shynet/startup_checks.sh
          reason: Runs manage.py migrate at startup.
      dockerfilePath:
        - path: Dockerfile
          reason: Root Dockerfile.
      port:
        - path: shynet/webserver.sh
          reason: gunicorn binds 0.0.0.0:${PORT:-8080}; Dockerfile EXPOSE 8080.
      healthPath:
        - path: shynet/shynet/urls.py
          reason: healthz/ routes to django-health-check.
    uncertainties:
      - Django ALLOWED_HOSTS defaults to localhost; ALB health probes with another Host header could return 400 unless ALLOWED_HOSTS is set.
      - DJANGO_SECRET_KEY and ALLOWED_HOSTS are required env values.
  - id: repo-554
    repo: axllent/mailpit
    commit: b8603907d47334fc6fdc43e4eb1b230d0bbf7303
    expected:
      compatibility: NEEDS_CONFIGURATION
      runtime:
        - go
      monorepo: false
      postgres: false
      redis: false
      worker: false
      storage: false
      migration: false
      dockerfilePath: Dockerfile
      port: 8025
      healthPath: /livez
    citations:
      compatibility:
        - path: Dockerfile
          reason: "EXPOSE 1025 1110 8025: HTTP UI is 8025, so the port needs vendor selection; data is ephemeral unless a database file is set."
      runtime:
        - path: go.mod
          reason: Go module.
      monorepo:
        - path: go.mod
          reason: Single Go module at root.
      postgres:
        - path: go.mod
          reason: Only modernc.org/sqlite; no PostgreSQL driver.
      redis:
        - path: go.mod
          reason: No Redis client.
      worker:
        - path: Dockerfile
          reason: Single /mailpit binary entrypoint.
      storage:
        - path: config/config.go
          reason: Database is an optional local SQLite file; no object storage.
      migration:
        - path: Dockerfile
          reason: No migration command; SQLite schema managed in process.
      dockerfilePath:
        - path: Dockerfile
          reason: Root Dockerfile.
      port:
        - path: config/config.go
          reason: HTTPListen default [::]:8025 (web UI).
      healthPath:
        - path: server/server.go
          reason: Routes GET livez and readyz.
    uncertainties:
      - SMTP (1025) is the product core and is not reachable through an HTTP load balancer; only the web UI is deployable.
      - Alternative verdict NOT_COMPATIBLE if SMTP-only use is required.
      - /readyz also valid as health path.
  - id: repo-555
