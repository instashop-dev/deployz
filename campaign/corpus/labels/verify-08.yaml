          reason: Collector runs as a second process in the same container; no separate worker image.
      storage:
        - path: docker/docker-entrypoint.sh
          reason: Storage is the local STORAGE_DIR, not object storage.
      migration:
        - path: docker/docker-entrypoint.sh
          reason: Runs prisma migrate deploy before starting the server.
      appRoot:
        - path: package.json
