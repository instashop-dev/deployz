apps:
  - id: repo-571
    repo: firezone/firezone
    commit: 29ee99456ae20d839667bbb4d143b0eb97091607
    expected:
      compatibility: NEEDS_CONFIGURATION
      runtime: [elixir]
      monorepo: true
      postgres: true
      redis: false
      worker: false
      storage: false
      migration: true
      appRoot: elixir
      dockerfilePath: elixir/Dockerfile
      port: 13000
      healthPath: /readyz
      unsupported: []
    citations:
      compatibility:
        - path: elixir/Dockerfile
          reason: Release build needs the APPLICATION_NAME build arg (no default); the final stage copies the release by that name, so a plain build is not runnable without configuration.
        - path: elixir/sample.env
          reason: Many required runtime secrets and identity-provider values.
      runtime:
        - path: elixir/mix.exs
          reason: Phoenix/Elixir Mix project.
      monorepo:
        - path: elixir/mix.exs
          reason: The Elixir portal is one app inside a multi-language repository (appPath elixir).
      postgres:
        - path: elixir/mix.exs
          reason: postgrex and ecto_sql dependencies.
      redis:
        - path: elixir/mix.exs
          reason: No Redis client dependency.
      worker:
        - path: elixir/mix.exs
          reason: Oban jobs run inside the same release; no separate worker process or Dockerfile.
      storage:
        - path: elixir/config/runtime.exs
          reason: The only S3 use is an optional log-sink client; no application object storage.
      migration:
        - path: elixir/rel/overlays/bin/migrate
          reason: Release migrate script runs Portal.Release.migrate; bin/server runs it before start.
      appRoot:
        - path: elixir/mix.exs
          reason: Mix project root is the elixir directory.
      dockerfilePath:
        - path: elixir/Dockerfile
          reason: Only Dockerfile of the app; build context is the elixir directory.
      port:
        - path: elixir/config/config.exs
          reason: PortalWeb.Endpoint default url port is 13000.
      healthPath:
        - path: elixir/lib/portal/health.ex
          reason: Plug serves GET /readyz.
      unsupported:
        - path: elixir/mix.exs
          reason: No MySQL, MongoDB, Kafka or other unsupported-family dependency.
