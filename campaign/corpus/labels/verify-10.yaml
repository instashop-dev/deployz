          reason: "Storage URI comes only from MONGO_CONNECTION / MONGODB_URI; MongoDB is the required datastore and is outside the MVP."
        - path: docker-compose.yml
          reason: "The reference deployment runs a mongo:5 service and sets MONGO_CONNECTION to it."
      runtime:
        - path: package.json
          reason: "Node application, start script is node lib/server/server.js, engines node >=20."
