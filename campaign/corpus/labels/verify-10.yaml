        - path: package.json
          reason: "Single root package; static/colorbrewer/package.json is a vendored asset, not a workspace."
      postgres:
        - path: package.json
          reason: "Dependencies list mongodb and no PostgreSQL client."
      redis:
        - path: package.json
          reason: "No Redis client dependency."
      worker:
        - path: Procfile
          reason: "Procfile declares only a web process."
      dockerfilePath:
        - path: Dockerfile
          reason: "Multi-stage Dockerfile at the repository root builds and runs the app."
      port:
        - path: Dockerfile
          reason: "EXPOSE 1337; env.js also defaults PORT to 1337."
      healthPath:
        - path: lib/api/index.js
          reason: "Mounts the /status route under the API prefix, giving /api/v1/status."
      unsupported:
        - path: package.json
          reason: "mongodb driver dependency maps to the mongodb unsupported family."
