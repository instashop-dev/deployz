      appRoot: .
      dockerfilePath: docker/production/Dockerfile
      port: 8080
      healthPath: /up
    citations:
      compatibility:
        - path: .env.example
          reason: Default DB_CONNECTION=sqlite; APP_KEY and DB variables needed.
        - path: docker/production/docker-compose.mysql.yml
          reason: Expects storage and Modules volumes.
      runtime:
        - path: composer.json
          reason: Laravel PHP app.
      monorepo:
        - path: composer.json
          reason: Single app at root.
      postgres:
        - path: config/database.php
          reason: pgsql connection configured; pgsql PHP extension installed in production image.
      redis:
        - path: docker/production/Dockerfile
          reason: PHP redis extension installed but compose files use file cache and sessions; not required.
      worker:
        - path: docker/production/Dockerfile
          reason: Scheduler runs inside the web container under s6; no declared separate worker.
      appRoot:
        - path: artisan
          reason: Laravel app at repo root.
      dockerfilePath:
        - path: docker/production/Dockerfile
          reason: Production Dockerfile; docker/development/Dockerfile is for development.
      port:
        - path: docker/production/docker-compose.mysql.yml
          reason: Maps host port to container 8080.
      healthPath:
        - path: bootstrap/app.php
          reason: health route '/up'.
    uncertainties:
      - Production compose files cover only MySQL/MariaDB and SQLite; Postgres is a development compose variant and a PHP extension, not a documented production path.
      - Dockerfile is not at root, so a root-only Dockerfile detector would miss it.
      - Scheduler s6 service is in-container; worker=false is a judgement.
