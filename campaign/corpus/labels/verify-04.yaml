apps:
  - id: repo-531
    repo: sissbruecker/linkding
    commit: 27b7303baf41bb28babc610ac8eaa486e1ddfab5
    expected:
      compatibility: NEEDS_CONFIGURATION
      runtime: [python]
      monorepo: false
      postgres: true
      redis: false
      worker: false
      appRoot: .
      dockerfilePath: docker/default.Dockerfile
      port: 9090
      healthPath: /health
    citations:
      compatibility:
        - path: .env.sample
          reason: Default DB is SQLite; Postgres only through LD_DB_ENGINE and LD_DB_* variables.
        - path: bootstrap.sh
          reason: Writes data/ (SQLite, favicons, previews, secret key) to local disk.
      runtime:
        - path: pyproject.toml
          reason: Django project (Python).
      monorepo:
        - path: pyproject.toml
          reason: Single app at repo root; package.json only builds frontend assets.
      postgres:
        - path: .env.sample
          reason: LD_DB_ENGINE can be postgres.
      redis:
        - path: pyproject.toml
          reason: No Redis dependency; background tasks use Huey with SQLite storage.
      worker:
        - path: supervisord-tasks.conf
          reason: Huey consumer runs inside the same container under supervisord; no separate declared worker service.
      appRoot:
        - path: manage.py
          reason: App at repo root.
      dockerfilePath:
        - path: docker/default.Dockerfile
          reason: Only Dockerfiles are under docker/ (default and alpine); none at root.
      port:
        - path: docker/default.Dockerfile
          reason: EXPOSE 9090.
      healthPath:
        - path: bookmarks/urls.py
          reason: path("health", health_view).
    uncertainties:
      - Compatibility could be NOT_COMPATIBLE if the SQLite default and the data dir (favicons, previews) count as required local disk state; label assumes Postgres via env is enough.
      - Dockerfile is not at root; docker/alpine.Dockerfile is a second candidate.
      - Huey worker is started inside the web container (bootstrap.sh), so worker=false.
  - id: repo-532
    repo: pretix/pretix
    commit: ba36d649c6ed1dde278c35d9ae4e609723c78bce
    expected:
      compatibility: NEEDS_CONFIGURATION
      runtime: [python]
      monorepo: false
      postgres: true
      redis: false
      worker: false
      appRoot: .
      dockerfilePath: Dockerfile
      port: 80
      healthPath: /healthcheck/
    citations:
      compatibility:
        - path: src/pretix/settings.py
          reason: Default DB sqlite3 under DATA_DIR; Postgres or MySQL via config or env; needs site URL and secrets.
        - path: Dockerfile
          reason: VOLUME /etc/pretix and /data (config file and data dir expected mounted).
      runtime:
        - path: Dockerfile
          reason: python base image, Django app.
      monorepo:
        - path: pyproject.toml
          reason: Single app (src/pretix) with root build files.
      postgres:
        - path: src/pretix/settings.py
          reason: db_backend postgresql supported.
      redis:
        - path: src/pretix/settings.py
          reason: Redis is optional (HAS_REDIS only when config given).
      worker:
        - path: deployment/docker/supervisord/pretixtask.conf
          reason: Celery taskworker runs under supervisord in the same container (CMD all); not a declared separate service.
      appRoot:
        - path: Dockerfile
          reason: Dockerfile at repo root builds the app.
      dockerfilePath:
        - path: Dockerfile
          reason: Root Dockerfile.
      port:
        - path: deployment/docker/nginx.conf
          reason: nginx listens on 80.
      healthPath:
        - path: src/pretix/urls.py
          reason: re_path healthcheck/ route.
    uncertainties:
      - Image expects pretix.cfg mounted at /etc/pretix; env-var config exists (EnvOrParserConfig) so NEEDS_CONFIGURATION chosen over NOT_COMPATIBLE.
      - Celery worker without Redis uses a fallback broker; Redis is recommended, not required. redis=false is a judgement.
      - Healthcheck view may reject non-matching Host headers (not verified).
  - id: repo-533
