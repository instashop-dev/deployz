      healthPath: /health
    citations:
      compatibility:
        - path: packages/sync-server/package.json
          reason: Only better-sqlite3 is a database dependency; state lives on local disk.
        - path: sync-server.Dockerfile
          reason: Creates /data owned by the app user for server state.
      runtime:
        - path: package.json
          reason: Node and Yarn.
      monorepo:
        - path: package.json
          reason: Yarn workspaces with packages/*.
      postgres:
        - path: packages/sync-server/package.json
          reason: No Postgres client dependency.
      redis:
        - path: packages/sync-server/package.json
          reason: No Redis dependency.
      worker:
        - path: sync-server.Dockerfile
          reason: Single node build/app.js process.
      appRoot:
        - path: sync-server.Dockerfile
          reason: Build uses the repo root as context (workspaces).
      dockerfilePath:
        - path: sync-server.Dockerfile
          reason: Production image; root Dockerfile is a development container.
      port:
        - path: sync-server.Dockerfile
          reason: EXPOSE 5006.
      healthPath:
        - path: packages/sync-server/src/app.ts
          reason: app.get('/health').
    uncertainties:
      - NOT_COMPATIBLE rests on SQLite-only storage; sqlite is not in UNSUPPORTED_FAMILIES so the unsupported field is omitted.
