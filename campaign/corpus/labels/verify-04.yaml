    commit: 184200a6cc1e747dcdc8f58c97bf72c52179d57f
    expected:
      compatibility: NEEDS_CONFIGURATION
      runtime: [rust]
      monorepo: false
      postgres: true
      redis: false
      worker: false
      appRoot: .
      dockerfilePath: Dockerfile
      port: 8888
      healthPath: /healthz
    citations:
      compatibility:
        - path: Dockerfile
          reason: ENTRYPOINT atuin-server has no CMD; subcommand start is required.
        - path: crates/atuin-server/src/settings.rs
          reason: Default host 127.0.0.1; ATUIN_HOST and ATUIN_DB_URI needed.
      runtime:
        - path: Cargo.toml
          reason: Rust workspace.
      monorepo:
        - path: Cargo.toml
          reason: Cargo workspace but one deployable server binary (atuin-server).
      postgres:
        - path: crates/atuin-server/server.toml
          reason: db_uri accepts postgres (also sqlite and mysql).
      redis:
        - path: crates/atuin-server/Cargo.toml
          reason: No Redis dependency.
      worker:
        - path: crates/atuin-server/src/bin/main.rs
          reason: Only Start and DefaultConfig commands; no worker process.
      appRoot:
        - path: Dockerfile
          reason: Root Dockerfile builds atuin-server.
      dockerfilePath:
        - path: Dockerfile
          reason: Root Dockerfile.
      port:
        - path: crates/atuin-server/src/settings.rs
          reason: set_default port 8888.
      healthPath:
        - path: crates/atuin-server/src/router.rs
          reason: route /healthz.
    uncertainties:
      - Dockerfile ENTRYPOINT needs the arg "start"; if Deployz cannot set a start command the deploy fails, which could mean NOT_COMPATIBLE.
      - The workspace of many crates could be counted as monorepo=true by another labeller.
      - Server also supports sqlite and mysql; postgres chosen as the supported option.
