  - id: repo-535
    repo: we-promise/sure
    commit: 00dd977fbad504b56af1921ec3c34fcd1925218c
    expected:
      compatibility: NEEDS_CONFIGURATION
      runtime: [ruby]
      monorepo: false
      postgres: true
      redis: true
      worker: true
      appRoot: .
      dockerfilePath: Dockerfile
      port: 3000
      healthPath: /up
    citations:
      compatibility:
        - path: compose.example.yml
          reason: Needs SECRET_KEY_BASE, DB_HOST, REDIS_URL and optional keys; storage volume for uploads by default.
        - path: config/storage.yml
          reason: Active Storage defaults to local Disk; S3 service available via env.
      runtime:
        - path: Gemfile
          reason: Rails app.
      monorepo:
        - path: Gemfile
          reason: Single Rails app at root.
      postgres:
        - path: compose.example.yml
          reason: postgres:16 service.
      redis:
        - path: compose.example.yml
          reason: REDIS_URL and redis service.
      worker:
        - path: compose.example.yml
          reason: worker service runs bundle exec sidekiq with the same image.
        - path: Procfile.dev
          reason: worker process sidekiq.
      appRoot:
        - path: Dockerfile
          reason: Root Dockerfile, WORKDIR /rails.
      dockerfilePath:
        - path: Dockerfile
          reason: Root Dockerfile.
      port:
        - path: Dockerfile
          reason: EXPOSE 3000.
      healthPath:
        - path: config/routes.rb
          reason: get "up" rails health check.
    uncertainties:
      - Could be READY if SECRET_KEY_BASE and local-disk storage are not treated as blockers.
      - RAILS_FORCE_SSL and RAILS_ASSUME_SSL default to true in production; behind the ALB the health path redirect behaviour is not verified.
      - Migration runs in docker-entrypoint (db:prepare) only for the server command.
