# Initial expected-behavior labels, corpus batch 2 (P1-LABEL-02).
# Source-only labels: written from repository files at the pinned commit.
# Path convention: appRoot and dockerfilePath are relative to the repository root.
# appRoot "." means the repository root. dockerfilePath is omitted when the
# repository has no Dockerfile for the target app.
# Convention for migration: true means the app has database migrations that a
# deploy must run, even when the app runs them itself at start.
# Convention for storage: true means the app can keep user files in S3-compatible storage.
