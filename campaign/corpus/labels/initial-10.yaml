          reason: Redis code in server/src/addons manages Redis for deployed apps; it is not a Kubero runtime dependency.
      worker:
        - path: Dockerfile
          reason: Single CMD node main.
      dockerfilePath:
        - path: Dockerfile
          reason: Runtime Dockerfile at the repository root, building server and client.
      port:
        - path: server/src/main.ts
          reason: app.listen(process.env.PORT ?? 2000).
      migration:
        - path: server/prisma/migrations
          reason: Prisma migrations with a prisma migrate deploy script in server/package.json.
