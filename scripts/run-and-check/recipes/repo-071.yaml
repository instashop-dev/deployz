id: repo-071
set: tuning
source:
  kind: git
  repository: chatwoot/chatwoot
  commit: da4898e7f5e2f2146cd2c24d3a7bd3124016cf82
build:
  dockerfile: docker/Dockerfile
  context: .
  buildArgs:
    BUILDKIT_CONTEXT_KEEP_GIT_DIR: "1"
vendorInputs:
  - name: SECRET_KEY_BASE
    source:
      kind: generated
      format: hex64
  - name: FRONTEND_URL
    source:
      kind: fixed
      value: http://localhost
notes:
  - The root has no Dockerfile. docker/Dockerfile is the production image (RAILS_ENV=production, assets precompiled). docker/dockerfiles/rails.Dockerfile is for development. The file has no CMD, so the start command comes from the Analysis.
  - The Dockerfile runs git rev-parse HEAD (docker/Dockerfile, pre-builder stage), so the Git URL context must keep the .git folder (BUILDKIT_CONTEXT_KEEP_GIT_DIR=1).
  - SECRET_KEY_BASE is required in production (.env.example). FRONTEND_URL is read for the route host (config/environments/production.rb:105) and is not a derived name, so a fixed value is given. Reviewer to check that it is a start condition.
